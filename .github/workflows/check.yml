# Every push and pull request to main: scripts/check.sh, and a secret
# scan over the full history. The end-to-end test needs real hardware
# and runs before each release instead.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read the code, nothing else. A workflow can't push, comment or release.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check.sh --tui
        run: ./scripts/check.sh --tui

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still in it
          persist-credentials: false
      # --redact: findings name the file, line and rule, never the secret.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner -v
